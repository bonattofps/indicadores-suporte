<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eefbf7"/>
      <stop offset="0.48" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eff8ff"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#144b6e" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
    <style>
      .font { font-family: Inter, Segoe UI, Arial, sans-serif; }
      .title { font-size: 58px; font-weight: 900; fill: #102033; }
      .subtitle { font-size: 22px; fill: #567086; }
      .eyebrow { font-size: 15px; font-weight: 900; letter-spacing: 5px; fill: #567086; }
      .brandText { font-size: 28px; font-weight: 900; fill: url(#brand); }
      .boxTitle { font-size: 24px; font-weight: 900; fill: #102033; }
      .boxSmall { font-size: 15px; font-weight: 900; letter-spacing: 2px; fill: #567086; }
      .boxText { font-size: 17px; fill: #315a72; }
      .centerTitle { font-size: 34px; font-weight: 900; fill: #102033; }
      .centerText { font-size: 18px; fill: #315a72; }
      .pillText { font-size: 16px; font-weight: 900; fill: #17435d; }
      .line { stroke: #38bdf8; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .lineSoft { stroke: #b9d8e7; stroke-width: 3; fill: none; }
    </style>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="126" cy="86" r="170" fill="#22c55e" opacity="0.09"/>
  <circle cx="1780" cy="1020" r="260" fill="#38bdf8" opacity="0.08"/>

  <g class="font">
    <text x="86" y="74" class="brandText">Uni Internet</text>
    <text x="86" y="122" class="eyebrow">APRESENTAÇÃO EXECUTIVA</text>
    <text x="86" y="190" class="title">Como funciona o SGP</text>
    <text x="86" y="230" class="subtitle">Mapa visual do fluxo de acesso, dados, dashboards, gestão e melhoria contínua do suporte.</text>

    <g filter="url(#shadow)">
      <rect x="760" y="368" width="400" height="210" rx="18" fill="#ffffff" stroke="#cfe2ee" stroke-width="2"/>
      <rect x="760" y="368" width="400" height="12" rx="6" fill="url(#brand)"/>
      <text x="960" y="438" text-anchor="middle" class="centerTitle">SGP</text>
      <text x="960" y="472" text-anchor="middle" class="centerText">Sistema Gestão do Suporte</text>
      <text x="960" y="515" text-anchor="middle" class="centerText">Centraliza acesso, indicadores, operação</text>
      <text x="960" y="543" text-anchor="middle" class="centerText">e acompanhamento semanal.</text>
    </g>

    <path class="line" d="M 760 430 C 640 430 604 338 500 338"/>
    <path class="line" d="M 760 520 C 640 520 604 716 500 716"/>
    <path class="line" d="M 1160 430 C 1280 430 1316 338 1420 338"/>
    <path class="line" d="M 1160 520 C 1280 520 1316 716 1420 716"/>

    <g filter="url(#shadow)">
      <rect x="96" y="278" width="404" height="210" rx="14" fill="#ffffff" stroke="#cfe2ee" stroke-width="2"/>
      <rect x="96" y="278" width="8" height="210" rx="4" fill="#009c67"/>
      <text x="126" y="326" class="boxSmall">01 ACESSO E SEGURANÇA</text>
      <text x="126" y="366" class="boxTitle">Quem entra no sistema</text>
      <text x="126" y="408" class="boxText">Login com Firebase Authentication</text>
      <text x="126" y="438" class="boxText">Email confirmado e recuperação de senha</text>
      <text x="126" y="468" class="boxText">Cargo define dashboards permitidas</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="96" y="656" width="404" height="232" rx="14" fill="#ffffff" stroke="#cfe2ee" stroke-width="2"/>
      <rect x="96" y="656" width="8" height="232" rx="4" fill="#38bdf8"/>
      <text x="126" y="704" class="boxSmall">02 FONTES DE DADOS</text>
      <text x="126" y="744" class="boxTitle">Como os dados entram</text>
      <text x="126" y="786" class="boxText">Google Sheets sincronizado</text>
      <text x="126" y="816" class="boxText">Lançamentos manuais no SGP</text>
      <text x="126" y="846" class="boxText">Firebase Firestore para cadastros</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="1420" y="252" width="404" height="288" rx="14" fill="#ffffff" stroke="#cfe2ee" stroke-width="2"/>
      <rect x="1420" y="252" width="8" height="288" rx="4" fill="#f0b429"/>
      <text x="1450" y="300" class="boxSmall">03 DASHBOARDS</text>
      <text x="1450" y="340" class="boxTitle">Onde a operação acompanha</text>
      <g>
        <rect x="1450" y="372" width="155" height="34" rx="17" fill="#e9fff5" stroke="#9bd8c2"/>
        <text x="1528" y="394" text-anchor="middle" class="pillText">Indicadores</text>
        <rect x="1620" y="372" width="155" height="34" rx="17" fill="#eef8ff" stroke="#b9d8e7"/>
        <text x="1698" y="394" text-anchor="middle" class="pillText">Colaboradores</text>
        <rect x="1450" y="420" width="155" height="34" rx="17" fill="#fffaf0" stroke="#f5d48b"/>
        <text x="1528" y="442" text-anchor="middle" class="pillText">Ocorrências</text>
        <rect x="1620" y="420" width="155" height="34" rx="17" fill="#e9fff5" stroke="#9bd8c2"/>
        <text x="1698" y="442" text-anchor="middle" class="pillText">Jornadas</text>
        <rect x="1450" y="468" width="155" height="34" rx="17" fill="#eef8ff" stroke="#b9d8e7"/>
        <text x="1528" y="490" text-anchor="middle" class="pillText">CTO / PPPoE</text>
        <rect x="1620" y="468" width="155" height="34" rx="17" fill="#fff7f7" stroke="#f4b3b3"/>
        <text x="1698" y="490" text-anchor="middle" class="pillText">Reincidência</text>
      </g>
    </g>

    <g filter="url(#shadow)">
      <rect x="1420" y="656" width="404" height="232" rx="14" fill="#ffffff" stroke="#cfe2ee" stroke-width="2"/>
      <rect x="1420" y="656" width="8" height="232" rx="4" fill="#ef5b5b"/>
      <text x="1450" y="704" class="boxSmall">04 GESTÃO E MELHORIA</text>
      <text x="1450" y="744" class="boxTitle">Como vira ação</text>
      <text x="1450" y="786" class="boxText">Metas configuráveis por indicador</text>
      <text x="1450" y="816" class="boxText">Feedback individual em PDF</text>
      <text x="1450" y="846" class="boxText">Relatórios para acompanhamento gerencial</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="586" y="840" width="748" height="118" rx="16" fill="#ffffff" stroke="#cfe2ee" stroke-width="2"/>
      <text x="960" y="884" text-anchor="middle" class="boxSmall">RESULTADO DO FLUXO</text>
      <text x="960" y="924" text-anchor="middle" class="boxTitle">Dados viram acompanhamento, metas e decisão operacional</text>
    </g>

    <path class="lineSoft" d="M 960 578 L 960 840"/>
  </g>
</svg>
