<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Indicadores Gerais - Apresentação</title>
    <link rel="stylesheet" href="apresentacao.css" />
  </head>
  <body>
    <main class="presentation">
      <header class="hero">
        <div>
          <p class="eyebrow">Métrica Matriz - 2026</p>
          <h1>Indicadores Gerais</h1>
        </div>
        <div class="view-switcher">
          <a class="active" href="apresentacao.html">Indicadores Gerais</a>
          <a href="colaboradores.html">Colaboradores</a>
          <button id="themeToggle" type="button">Tema escuro</button>
        </div>
        <div class="week-tabs" id="weekTabs">
          <button class="active" type="button" data-week="ultima">Última Semana</button>
          <button type="button" data-week="s1">1ª Semana</button>
          <button type="button" data-week="s2">2ª Semana</button>
          <button type="button" data-week="s3">3ª Semana</button>
          <button type="button" data-week="s4">4ª Semana</button>
        </div>
        <label class="file-action">
          <input id="fileInput" type="file" accept=".xlsx,.xls,.csv" />
          Importar CSV/XLSX
        </label>
      </header>

      <section class="kpi-board" id="kpiBoard"></section>

      <section class="content-grid">
        <article class="panel wide">
          <div class="panel-head"><div><p class="eyebrow">Evolução semanal</p><h2>Atendimentos IXC</h2></div></div>
          <div class="chart-box"><canvas id="ixcChart"></canvas></div>
        </article>
        <article class="panel">
          <div class="panel-head"><div><p class="eyebrow">Performance</p><h2>Status das metas</h2></div></div>
          <div class="goal-list" id="goalList"></div>
        </article>
        <article class="panel wide">
          <div class="panel-head"><div><p class="eyebrow">Comparativo</p><h2>Indicadores principais por semana</h2></div></div>
          <div class="chart-box"><canvas id="mainChart"></canvas></div>
        </article>
        <article class="panel">
          <div class="panel-head"><div><p class="eyebrow">Resumo</p><h2>Semana selecionada</h2></div></div>
          <div class="summary" id="summary"></div>
        </article>
      </section>

      <section class="panel table-panel">
        <div class="panel-head"><div><p class="eyebrow">Base executiva</p><h2>Tabela de indicadores</h2></div></div>
        <div class="table-scroll">
          <table>
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="apresentacao.js"></script>
  </body>
</html>
